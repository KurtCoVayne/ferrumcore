# FerrumCore workspace — pre-Gate-1 scaffold (ADR-0002/0003). Real, buildable, gate-enforced.
# Only shared/fc-money exists initially (its Money type lands after ADR-0005 spike — DONE; see plan/spikes/decimal).
# Domain/service crates are added per the repository blueprint (governance/part-4) as Gate-1 opens.
[workspace]
resolver = "3"                                  # edition 2024
members = [
    "shared/fc-money",
    "shared/fc-domain-shared",
    "shared/fc-domain-charge-tax-rates",
    "shared/fc-proto",
    "shared/fc-contracts",
    "services/core-ledger/crates/domain/loan-lifecycle",
    "services/core-ledger/crates/domain/loan-schedule",
    "services/core-ledger/crates/domain/loan-allocation",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "FerrumCore"

# Single source of dependency versions (ADR-0002). bigdecimal validated by the B1 spike (plan/spikes/decimal).
[workspace.dependencies]
bigdecimal = "0.4"
time = { version = "0.3", default-features = false, features = ["std"] }
prost = "0.14"
prost-build = "0.14"
protox = "0.9"
apache-avro = "0.21"
fc-money = { path = "shared/fc-money" }
fc-domain-shared = { path = "shared/fc-domain-shared" }
fc-domain-charge-tax-rates = { path = "shared/fc-domain-charge-tax-rates" }
fc-proto = { path = "shared/fc-proto" }
fc-contracts = { path = "shared/fc-contracts" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"        # financial safety — no panics-by-unwrap in non-test code
expect_used = "deny"
panic = "deny"
float_arithmetic = "deny"  # no binary floats in money paths (ADR-0005)

[profile.release]
overflow-checks = true      # arithmetic overflow must panic, not wrap (financial safety)
panic = "unwind"            # so the tx boundary can roll back
lto = "thin"
codegen-units = 1
